server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json application/geo+json image/svg+xml;
    gzip_min_length 1024;

    location = /healthz { access_log off; return 200 "ok\n"; }

    # HTML luôn lấy bản mới; JS/CSS cache ngắn để cập nhật nhanh khi deploy lại
    location = /index.html { add_header Cache-Control "no-cache"; }
    location ~* \.(js|css|json|geojson)$ { add_header Cache-Control "public, max-age=300"; }

    location / { try_files $uri $uri/ /index.html; }
}
