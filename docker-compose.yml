services:
  # Bản chạy thật: đóng gói mã vào image
  web:
    build: .
    image: saban-kich-ban:latest
    ports:
      - "${PORT:-8765}:80"
    restart: unless-stopped

  # Bản phát triển: gắn trực tiếp thư mục platform, sửa file là F5 thấy ngay
  # Chạy: docker compose --profile dev up dev
  dev:
    image: nginx:1.27-alpine
    profiles: ["dev"]
    ports:
      - "${DEV_PORT:-8766}:80"
    volumes:
      - ./platform:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro

